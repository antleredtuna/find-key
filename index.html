<!-- findKey.html - Key Finder Web App (modular rewrite) -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Key Finder</title>
    <link rel="icon" type="image/jpeg" href="./kf_icon.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <div class="header">
        <h1>
          KEY FINDER
          <span style="font-size: 10px; color: var(--text-muted)">v1.1.5</span>
        </h1>
        <div class="header-right">
          <button
            class="tune-btn"
            id="tuneBtn"
            title="Tuning / calibrate screen"
          >
            TUNE
          </button>
          <div class="status-dot" id="statusDot"></div>
        </div>
      </div>

      <!-- Cents Deviation / Current Note -->
      <div class="cents-bar">
        <div class="cents-note-row">
          <span class="cents-note-name" id="centsNoteName">&mdash;</span>
          <span class="cents-note-octave" id="centsNoteOctave"></span>
          <span class="cents-note-freq" id="centsNoteFreq"></span>
          <span
            class="tuning-readout"
            id="tuningReadout"
            title="Estimated tuning of the incoming source. Tap to apply/ignore in key analysis."
          ></span>
        </div>
        <div class="cents-scale">
          <div class="cents-labels">
            <span>-50&cent;</span>
            <span id="centsCurrent">0&cent;</span>
            <span>+50&cent;</span>
          </div>
          <div class="cents-track">
            <div class="cents-center-line"></div>
            <div class="cents-dot" id="centsDot"></div>
          </div>
        </div>
      </div>

      <!-- Pitch Graph (Piano Roll) -->
      <div class="pitch-graph-container" id="graphContainer">
        <div class="pitch-graph-labels" id="graphLabels"></div>
        <div class="playhead"></div>
        <canvas id="pitchCanvas"></canvas>
      </div>

      <!-- Controls -->
      <div class="controls-row">
        <div class="ctrl-group">
          <label>Filter</label>
          <select id="filterSelect">
            <option value="off">Off</option>
            <option value="harmonica">Harmonica</option>
            <option value="voice">Voice</option>
            <option value="general" selected>General</option>
          </select>
        </div>
        <div class="ctrl-group">
          <label>Clarity</label>
          <select id="claritySelect">
            <option value="0.80" selected>0.80</option>
            <option value="0.90">0.90</option>
            <option value="0.95">0.95</option>
          </select>
        </div>
        <div class="ctrl-group">
          <label>Chroma</label>
          <select id="chromaModeSelect">
            <option value="duration" selected>Duration</option>
            <option value="count">Note Count</option>
          </select>
        </div>
        <div class="ctrl-group">
          <label>Window</label>
          <select id="windowSelect">
            <option value="0">All</option>
            <option value="10">10s</option>
            <option value="30" selected>30s</option>
            <option value="60">60s</option>
          </select>
        </div>
        <div class="ctrl-group">
          <label>Noise</label>
          <select id="noiseFloorSelect">
            <option value="0.005">Low</option>
            <option value="0.01" selected>Med</option>
            <option value="0.025">High</option>
            <option value="0.05">V.High</option>
          </select>
        </div>
      </div>

      <!-- Spectrum (raw vs filtered) -->
      <div class="spectrum-section" id="spectrumSection">
        <div class="spectrum-header">
          <span class="spectrum-title">SPECTRUM</span>
          <span class="spectrum-legend">
            <span class="legend-item"><i class="swatch raw"></i>raw</span>
            <span class="legend-item"
              ><i class="swatch filtered"></i>filtered</span
            >
            <span class="spectrum-band" id="spectrumBand"></span>
          </span>
        </div>
        <div class="spectrum-canvas-wrap" id="spectrumWrap">
          <canvas id="spectrumCanvas"></canvas>
        </div>
      </div>

      <!-- Histogram + Key -->
      <div class="histogram-section">
        <div class="histogram-header">
          <span class="estimated-key empty" id="estimatedKey">Ready</span>
          <span class="key-correlation" id="keyCorrelation"></span>
        </div>
        <div class="histogram-bars" id="histogramBars"></div>
      </div>

      <!-- Bottom Buttons -->
      <div class="bottom-row">
        <button class="control-btn start" id="controlBtn">START</button>
        <button class="btn-capture" id="captureBtn">CAP</button>
        <button class="btn-clear" id="clearBtn">CLR</button>
      </div>
    </div>
    <script type="module" src="./js/app.js?v=3"></script>
  </body>
</html>
